services:
  # Backend API Web Service
  - type: web
    name: satyapramaan-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt && python seed_data.py
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: WEIGHT_FORENSIC
        value: "0.40"
      - key: WEIGHT_OCR
        value: "0.20"
      - key: WEIGHT_REGISTRY
        value: "0.40"

  # Frontend Static Site (Optional: can also be deployed to Vercel)
  - type: web
    name: satyapramaan-ui
    runtime: static
    region: oregon
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: satyapramaan-api
          property: host
